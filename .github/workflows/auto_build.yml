name: TVBox 五合一聚合
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run aggregator
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python python/ultimate_engine.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Sync aggregator outputs and JAR"
          file_pattern: "."
