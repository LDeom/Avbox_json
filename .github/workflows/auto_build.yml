name: TVBox聚合

on:
  schedule:
    - cron: '0 */12 * * *'  # 每12小时执行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行【五合一】聚合引擎
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python python/ultimate_engine.py

      - name: 自动提交更新的配置与JAR包
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Sync: L2深度验活 + JAR私有化更新"
          file_pattern: "output/* jar/*"
